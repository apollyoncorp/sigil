# sigil.apollyoncorp.com: the static editor served by nginx on 8080 (see Dockerfile).
# HSTS is not set here: Cloudflare adds it at the edge.

# Only 200/206/304 may be cached: a cached 404 at the edge would outlive the fix.
map $status $cc_immutable {
    ~^(200|206|304)$  "public, max-age=31536000, immutable";
    default           "no-store";
}
map $status $cc_static {
    ~^(200|206|304)$  "public, max-age=2592000";
    default           "no-store";
}
map $status $cc_page {
    ~^(200|206|304)$  "no-cache";
    default           "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik: a redirect must not leak the internal port or host.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json application/wasm text/plain;

    error_page 404 /404.html;

    # An add_header inside a location drops all inherited ones, so each location includes the security block.

    # The app: revalidated by ETag on every load.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $cc_page always;
        try_files /index.html =404;
    }

    # Hashed build output: cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $cc_immutable always;
        try_files $uri =404;
    }

    # Fonts: 30 days, some names carry no hash.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $cc_static always;
        try_files $uri =404;
    }

    # The service worker and the manifest must never be stale.
    location ~ ^/(sw\.js|service-worker\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Icons, og-image, robots, sitemap and anything else by name; unknown paths are 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $cc_page always;
        try_files $uri =404;
    }
}
