name: Publish sigil-mcp

# Publishes @apollyoncorp/sigil-mcp to npm with trusted publishing (OIDC): no
# NPM_TOKEN secret exists. The trusted publisher on npmjs.com must be set to
#   owner: apollyoncorp | repository: sigil
#   workflow filename: sigil-mcp-publish.yml | environment: npm
# See sigil-mcp/README.md ("Release") for the steps.
#
# Two jobs, so the OIDC token never exists where dependency code runs:
#   build   (contents: read only) installs dependencies, builds, tests, and packs
#           the tarball; install scripts run here and can reach no publish rights.
#   publish (id-token: write) installs nothing and checks out nothing: it only
#           downloads the tarball and runs `npm publish` on it.

on:
  push:
    tags:
      - "sigil-mcp-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and pack, but do not publish"
        type: boolean
        default: true

# One release at a time; a running publish is never cancelled halfway.
concurrency:
  group: sigil-mcp-publish
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the tag check below needs origin/master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a job that builds what gets published (cache poisoning).
          package-manager-cache: false

      - name: Decide what to do and check the version
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./sigil-mcp/package.json').version")"
          name="$(node -p "require('./sigil-mcp/package.json').name")"

          dry_run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            dry_run=true
          fi
          # Only a tag may publish; a manual run from a branch is always a dry run.
          if [ "$REF_TYPE" != "tag" ]; then
            dry_run=true
          else
            tag_version="${REF_NAME#sigil-mcp-v}"
            if [ "$REF_NAME" = "$tag_version" ] || [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $REF_NAME does not match sigil-mcp/package.json version $version (expected sigil-mcp-v$version)"
              exit 1
            fi
            # A tag can point at any commit, including one that never went
            # through master. Only code that is on master may be published.
            git fetch --no-tags origin master
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::Tag $REF_NAME points at $GITHUB_SHA, which is not on master; merge it into master and tag a commit on master"
              exit 1
            fi
          fi

          # A prerelease version needs an explicit dist-tag (npm refuses otherwise).
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac

          if [ "$dry_run" = "false" ] && npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm; bump the version and tag again"
            exit 1
          fi

          {
            echo "version=$version"
            echo "name=$name"
            echo "dry_run=$dry_run"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Package $name@$version, dry_run=$dry_run, dist-tag=$dist_tag"

      - name: Install dependencies (repo root)
        run: yarn install --frozen-lockfile

      - name: Install dependencies (sigil-mcp)
        working-directory: sigil-mcp
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: sigil-mcp
        run: yarn build

      - name: Unit tests
        working-directory: sigil-mcp
        run: yarn test

      - name: End-to-end test
        working-directory: sigil-mcp
        run: yarn e2e

      - name: End-to-end test (remote mode)
        working-directory: sigil-mcp
        run: yarn e2e:http

      # prepack rebuilds dist/ right before the tarball is made. The tarball is
      # made here, where there are no publish rights, and the publish job ships
      # exactly this file.
      - name: Pack
        working-directory: sigil-mcp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigil-mcp-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    # A dry run stops after build (build + test + pack are the rehearsal).
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment (Settings > Environments) to
    # make every publish wait for a manual approval.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      # No checkout and no install: nothing from the repo or its dependencies
      # runs in this job, only npm itself and the tarball.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          current="$(npm --version)"
          echo "npm $current, node $(node --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@^11.5.1
            echo "npm now $(npm --version)"
          fi

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sigil-mcp-tarball
          path: ${{ runner.temp }}/pack

      # Provenance is automatic with trusted publishing from a public repo;
      # --provenance makes it explicit.
      - name: Publish to npm
        env:
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/pack/*.tgz)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball, found ${#files[@]}"
            exit 1
          fi
          tarball="${files[0]}"
          # what is about to be published is the package the build job planned
          got="$(tar -xOzf "$tarball" package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(p.name+"@"+p.version)')"
          if [ "$got" != "$EXPECTED_NAME@$EXPECTED_VERSION" ]; then
            echo "::error::tarball is $got, expected $EXPECTED_NAME@$EXPECTED_VERSION"
            exit 1
          fi
          npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
